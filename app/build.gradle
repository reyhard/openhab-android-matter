plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

import java.util.zip.ZipFile
import java.security.MessageDigest
import groovy.json.JsonSlurper

def chipNativeMode = (findProperty("openhabMatterChipNativeMode") ?: "stub").toString().trim()
def chipPrebuiltDir = (findProperty("openhabMatterChipPrebuiltDir") ?: "").toString().trim()
def chipSupportedAbis = ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
def chipControllerArtifactsDir = (findProperty("openhabMatterChipControllerArtifactsDir") ?: "").toString().trim()
def chipPaaTrustStoreDir = (findProperty("openhabMatterChipPaaTrustStoreDir") ?: "").toString().trim()
def chipCdTrustStoreDir = (findProperty("openhabMatterChipCdTrustStoreDir") ?: "").toString().trim()
def chipArtifactExpectedSourceTag = (findProperty("openhabMatterChipArtifactExpectedSourceTag") ?: "").toString().trim()
def chipArtifactExpectedSourceCommit = (findProperty("openhabMatterChipArtifactExpectedSourceCommit") ?: "").toString().trim()
def releaseStoreFilePath = (findProperty("openhabMatterReleaseStoreFile") ?: "").toString().trim()
def releaseStorePassword = (findProperty("openhabMatterReleaseStorePassword") ?: "").toString()
def releaseKeyAlias = (findProperty("openhabMatterReleaseKeyAlias") ?: "").toString().trim()
def releaseKeyPassword = (findProperty("openhabMatterReleaseKeyPassword") ?: "").toString()
def hasReleaseSigning = !releaseStoreFilePath.isEmpty()
        && !releaseStorePassword.isEmpty()
        && !releaseKeyAlias.isEmpty()
        && !releaseKeyPassword.isEmpty()
def sha256File = { File file ->
    MessageDigest.getInstance("SHA-256").digest(file.bytes).encodeHex().toString()
}
def assertNoDuplicateJsonKeys = { String jsonText, File manifestFile ->
    def tokens = []
    try {
        def lexer = new groovy.json.JsonLexer(new java.io.StringReader(jsonText))
        while (lexer.hasNext()) {
            tokens.add(lexer.next())
        }
    } catch (Exception exception) {
        throw new GradleException(
                "Invalid connectedhomeip artifact provenance manifest: " + manifestFile,
                exception)
    }
    int[] cursor = [0]
    def peek = { cursor[0] < tokens.size() ? tokens[cursor[0]] : null }
    def syntaxError = { String message ->
        throw new GradleException(
                "Invalid connectedhomeip artifact provenance manifest " + manifestFile + ": " + message)
    }
    def parseValue = null
    def parseObject = null
    def parseArray = null
    parseValue = {
        def token = peek()
        if (token == null) {
            syntaxError("unexpected end of JSON")
        }
        switch (token.getType()) {
            case groovy.json.JsonTokenType.OPEN_CURLY:
                cursor[0]++
                parseObject()
                break
            case groovy.json.JsonTokenType.OPEN_BRACKET:
                cursor[0]++
                parseArray()
                break
            case groovy.json.JsonTokenType.STRING:
            case groovy.json.JsonTokenType.NUMBER:
            case groovy.json.JsonTokenType.TRUE:
            case groovy.json.JsonTokenType.FALSE:
            case groovy.json.JsonTokenType.NULL:
                cursor[0]++
                break
            default:
                syntaxError("unexpected token " + token.getText())
        }
    }
    parseObject = {
        def keys = new HashSet<String>()
        def token = peek()
        if (token == null) {
            syntaxError("unexpected end of object")
        }
        if (token.getType() == groovy.json.JsonTokenType.CLOSE_CURLY) {
            cursor[0]++
            return
        }
        while (true) {
            token = peek()
            if (token == null || token.getType() != groovy.json.JsonTokenType.STRING) {
                syntaxError("expected an object key")
            }
            String key = token.getValue() == null ? token.getText() : token.getValue().toString()
            if (!keys.add(key)) {
                throw new GradleException(
                        "connectedhomeip artifact manifest contains duplicate JSON property: " + key)
            }
            cursor[0]++
            token = peek()
            if (token == null || token.getType() != groovy.json.JsonTokenType.COLON) {
                syntaxError("expected ':' after object key")
            }
            cursor[0]++
            parseValue()
            token = peek()
            if (token == null) {
                syntaxError("unexpected end of object")
            }
            if (token.getType() == groovy.json.JsonTokenType.COMMA) {
                cursor[0]++
                continue
            }
            if (token.getType() == groovy.json.JsonTokenType.CLOSE_CURLY) {
                cursor[0]++
                return
            }
            syntaxError("expected ',' or '}' after object value")
        }
    }
    parseArray = {
        def token = peek()
        if (token == null) {
            syntaxError("unexpected end of array")
        }
        if (token.getType() == groovy.json.JsonTokenType.CLOSE_BRACKET) {
            cursor[0]++
            return
        }
        while (true) {
            parseValue()
            token = peek()
            if (token == null) {
                syntaxError("unexpected end of array")
            }
            if (token.getType() == groovy.json.JsonTokenType.COMMA) {
                cursor[0]++
                continue
            }
            if (token.getType() == groovy.json.JsonTokenType.CLOSE_BRACKET) {
                cursor[0]++
                return
            }
            syntaxError("expected ',' or ']' after array value")
        }
    }
    parseValue()
    if (cursor[0] != tokens.size()) {
        syntaxError("trailing JSON content")
    }
}
def chipControllerSupportedAbis = (findProperty("openhabMatterChipControllerAbis")
        ?: "arm64-v8a;armeabi-v7a;x86;x86_64")
        .toString()
        .split(";")
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
def chipControllerRequiredJars = [
        "CHIPController.jar",
        "CHIPInteractionModel.jar",
        "CHIPClusterID.jar",
        "CHIPClusters.jar",
        "AndroidPlatform.jar",
        "OnboardingPayload.jar",
        "libMatterTlv.jar",
        "libMatterJson.jar"
]
def chipControllerRequiredNativeLibraries = [
        "libCHIPController.so",
        "libc++_shared.so"
]
def chipControllerRequiredClassEntries = [
        "chip/devicecontroller/ChipDeviceController.class",
        "chip/devicecontroller/ControllerParams.class",
        "chip/devicecontroller/NetworkCredentials.class",
        'chip/devicecontroller/NetworkCredentials$ThreadCredentials.class',
        "chip/devicecontroller/CommissionParameters.class",
        'chip/devicecontroller/CommissionParameters$Builder.class',
        "chip/devicecontroller/ICDRegistrationInfo.class",
        'chip/devicecontroller/ICDRegistrationInfo$Builder.class',
        "chip/devicecontroller/ICDDeviceInfo.class",
        'chip/devicecontroller/ChipDeviceController$CompletionListener.class',
        "chip/devicecontroller/DeviceAttestationDelegate.class",
        "chip/devicecontroller/AttestationTrustStoreDelegate.class",
        "chip/devicecontroller/DeviceAttestation.class",
        "chip/devicecontroller/OpenCommissioningCallback.class",
        'chip/devicecontroller/GetConnectedDeviceCallbackJni$GetConnectedDeviceCallback.class',
        "chip/platform/AndroidChipPlatform.class",
        "chip/platform/AndroidBleManager.class",
        "chip/platform/AndroidNfcCommissioningManager.class",
        "chip/platform/PreferencesKeyValueStoreManager.class",
        "chip/platform/PreferencesConfigurationManager.class",
        "chip/platform/NsdManagerServiceResolver.class",
        "chip/platform/NsdManagerServiceBrowser.class",
        "chip/platform/ChipMdnsCallbackImpl.class",
        "chip/platform/DiagnosticDataProviderImpl.class",
        "chip/platform/BleCallback.class"
]
def generatedTrustStoreAssetsDir = layout.buildDirectory.dir("generated/openhabMatter/truststoreAssets")
def verifyJarFile = { File jar ->
    try {
        new ZipFile(jar).withCloseable {
        }
    } catch (IOException e) {
        throw new GradleException("Invalid connectedhomeip controller jar: " + jar, e)
    }
}

if (!["stub", "prebuilt"].contains(chipNativeMode)) {
    throw new GradleException("openhabMatterChipNativeMode must be 'stub' or 'prebuilt'.")
}

android {
    namespace "org.openhab.matter.companion"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.openhab.matter.companion"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "0.1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    if (chipNativeMode == "stub") {
        externalNativeBuild {
            cmake {
                path file("src/main/cpp/CMakeLists.txt")
                version "3.22.1"
            }
        }
    } else {
        sourceSets {
            main {
                jniLibs.srcDirs = [file(chipPrebuiltDir)]
            }
        }
    }

    if (!chipControllerArtifactsDir.isEmpty()) {
        sourceSets {
            main {
                java.srcDir file("src/connectedhomeip/java")
                jniLibs.srcDir file(new File(file(chipControllerArtifactsDir), "jniLibs"))
                assets.srcDir generatedTrustStoreAssetsDir
            }
        }
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        output.outputFileName = "openhab-matter-helper.apk"
    }
}

tasks.register("verifyOpenhabMatterChipNativeInputs") {
    doLast {
        if (chipNativeMode == "stub") {
            if (!file("src/main/cpp/openhab_matter_chip_stub.cpp").isFile()) {
                throw new GradleException("Stub native mode requires src/main/cpp/openhab_matter_chip_stub.cpp.")
            }
            return
        }
        if (chipPrebuiltDir.isEmpty()) {
            throw new GradleException("prebuilt native mode requires -PopenhabMatterChipPrebuiltDir=<dir>.")
        }
        File root = file(chipPrebuiltDir)
        if (!root.isDirectory()) {
            throw new GradleException("Prebuilt native directory does not exist: " + root)
        }
        chipSupportedAbis.each { abi ->
            File lib = new File(new File(root, abi), "libopenhab_matter_chip.so")
            if (!lib.isFile()) {
                throw new GradleException("Missing prebuilt native library: " + lib)
            }
        }
    }
}

tasks.register("verifyConnectedHomeIpControllerArtifacts") {
    doLast {
        if (chipControllerArtifactsDir.isEmpty()) {
            return
        }
        if (chipControllerSupportedAbis.isEmpty()) {
            throw new GradleException("openhabMatterChipControllerAbis must list at least one ABI.")
        }
        File root = file(chipControllerArtifactsDir)
        if (!root.isDirectory()) {
            throw new GradleException("connectedhomeip controller artifact directory does not exist: " + root)
        }
        File manifestFile = new File(root, "chip-artifact-manifest.json")
        if (!manifestFile.isFile()) {
            if (!chipArtifactExpectedSourceTag.isEmpty() || !chipArtifactExpectedSourceCommit.isEmpty()) {
                throw new GradleException(
                        "Missing connectedhomeip artifact provenance manifest: " + manifestFile)
            }
        } else {
            assertNoDuplicateJsonKeys(manifestFile.getText("UTF-8"), manifestFile)
            def manifest
            try {
                manifest = new JsonSlurper().parse(manifestFile)
            } catch (Exception exception) {
                throw new GradleException(
                        "Invalid connectedhomeip artifact provenance manifest: " + manifestFile,
                        exception)
            }
            if (!(manifest instanceof Map)) {
                throw new GradleException("connectedhomeip artifact manifest must be a JSON object: " + manifestFile)
            }
            if (manifest.connectedhomeip_tag == null
                    || manifest.connectedhomeip_tag.toString().trim().isEmpty()
                    || manifest.connectedhomeip_commit == null
                    || manifest.connectedhomeip_commit.toString().trim().isEmpty()
                    || manifest.abi == null
                    || manifest.abi.toString().trim().isEmpty()) {
                throw new GradleException(
                        "connectedhomeip artifact manifest is missing tag, commit, or ABI provenance")
            }
            if (!chipArtifactExpectedSourceTag.isEmpty()
                    && manifest.connectedhomeip_tag != chipArtifactExpectedSourceTag) {
                throw new GradleException(
                        "connectedhomeip artifact tag mismatch: expected "
                                + chipArtifactExpectedSourceTag
                                + " but manifest has "
                                + manifest.connectedhomeip_tag)
            }
            if (!chipArtifactExpectedSourceCommit.isEmpty()
                    && manifest.connectedhomeip_commit != chipArtifactExpectedSourceCommit) {
                throw new GradleException(
                        "connectedhomeip artifact commit mismatch: expected "
                                + chipArtifactExpectedSourceCommit
                                + " but manifest has "
                                + manifest.connectedhomeip_commit)
            }
            if (manifest.abi == null || !chipControllerSupportedAbis.contains(manifest.abi.toString())) {
                throw new GradleException(
                        "connectedhomeip artifact manifest ABI is not compatible with requested ABIs: "
                                + manifest.abi)
            }
            if (manifest.files == null || !(manifest.files instanceof Map)) {
                throw new GradleException("connectedhomeip artifact manifest does not list file checksums")
            }
            def safeRelativePath = { String path ->
                if (path == null || path.isEmpty() || path.contains("\\") || path.contains(":") || path.contains("\u0000")) {
                    return false
                }
                if (path.startsWith("/") || (path ==~ /^[A-Za-z]:.*/)) {
                    return false
                }
                return !path.split("/", -1).any { segment ->
                    segment.isEmpty() || segment == "." || segment == ".."
                }
            }
            def manifestFiles = new LinkedHashSet<String>()
            def manifestFilesCaseInsensitive = new TreeSet<String>(String.CASE_INSENSITIVE_ORDER)
            manifest.files.each { path, expectedDigest ->
                String relative = path.toString()
                if (!safeRelativePath(relative)) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest contains an unsafe file path: " + relative)
                }
                if (relative == "chip-artifact-manifest.json") {
                    throw new GradleException(
                            "connectedhomeip artifact manifest must not list itself as a checksummed file")
                }
                if (!manifestFiles.add(relative) || !manifestFilesCaseInsensitive.add(relative)) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest contains a duplicate file entry: " + relative)
                }
                if (!(expectedDigest.toString() ==~ /^[0-9a-f]{64}$/)) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest has an invalid checksum for " + relative)
                }
                File artifactFile = new File(root, relative)
                String rootPrefix = root.canonicalPath + File.separator
                if (!artifactFile.canonicalPath.startsWith(rootPrefix)) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest path escapes the artifact directory: "
                                    + relative)
                }
                if (!artifactFile.isFile()) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest lists a missing file: " + artifactFile)
                }
                if (java.nio.file.Files.isSymbolicLink(artifactFile.toPath())) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest lists a symbolic link: " + artifactFile)
                }
                String actualDigest = sha256File(artifactFile)
                if (actualDigest != expectedDigest.toString()) {
                    throw new GradleException(
                            "connectedhomeip artifact checksum mismatch for "
                                    + artifactFile
                                    + ": expected "
                                    + expectedDigest
                                    + " but found "
                                    + actualDigest)
                }
            }

            def packagedFiles = new LinkedHashSet<String>()
            def packagedFilesCaseInsensitive = new TreeSet<String>(String.CASE_INSENSITIVE_ORDER)
            root.eachFileRecurse { File packagedFile ->
                if (!packagedFile.isFile() || packagedFile.canonicalFile == manifestFile.canonicalFile) {
                    return
                }
                if (java.nio.file.Files.isSymbolicLink(packagedFile.toPath())) {
                    throw new GradleException(
                            "connectedhomeip artifact directory contains a symbolic link: " + packagedFile)
                }
                String relative = root.toPath()
                        .relativize(packagedFile.toPath())
                        .toString()
                        .replace(File.separator, "/")
                if (!safeRelativePath(relative)
                        || !packagedFiles.add(relative)
                        || !packagedFilesCaseInsensitive.add(relative)) {
                    throw new GradleException(
                            "connectedhomeip artifact directory contains an unsafe or duplicate path: "
                                    + relative)
                }
            }
            def unlistedFiles = packagedFiles.findAll { !manifestFiles.contains(it) }
            if (!unlistedFiles.isEmpty()) {
                throw new GradleException(
                        "connectedhomeip artifact directory contains unlisted files: "
                                + unlistedFiles.join(", "))
            }
            def uncoveredFiles = manifestFiles.findAll { !packagedFiles.contains(it) }
            if (!uncoveredFiles.isEmpty()) {
                throw new GradleException(
                        "connectedhomeip artifact manifest is missing packaged files: "
                                + uncoveredFiles.join(", "))
            }
            def requiredManifestFiles = new ArrayList<String>()
            chipControllerRequiredJars.each { requiredManifestFiles.add(it) }
            chipControllerRequiredNativeLibraries.each { library ->
                chipControllerSupportedAbis.each { abi ->
                    requiredManifestFiles.add("jniLibs/" + abi + "/" + library)
                }
            }
            requiredManifestFiles.each { required ->
                if (!manifestFiles.contains(required)) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest does not cover required file: " + required)
                }
            }
            def paaCertificateCount = fileTree(new File(root, "paa-root-certs"))
                    .matching { include "**/*.pem", "**/*.der" }
                    .files
                    .size()
            if (paaCertificateCount < 1) {
                throw new GradleException(
                        "connectedhomeip artifact manifest has no packaged PAA trust-store certificates")
            }
        }
        Set<String> discoveredClassEntries = new LinkedHashSet<>()
        chipControllerRequiredJars.each { jarName ->
            File jar = new File(root, jarName)
            if (!jar.isFile()) {
                throw new GradleException("Missing connectedhomeip controller jar: " + jar)
            }
            if (jar.length() <= 0) {
                throw new GradleException("Empty connectedhomeip controller jar: " + jar)
            }
            verifyJarFile(jar)
            new ZipFile(jar).withCloseable { zip ->
                zip.entries().each { entry ->
                    discoveredClassEntries.add(entry.name)
                }
            }
        }
        chipControllerRequiredClassEntries.each { classEntry ->
            if (!discoveredClassEntries.contains(classEntry)) {
                throw new GradleException("Missing connectedhomeip controller class entry: " + classEntry)
            }
        }
        chipControllerSupportedAbis.each { abi ->
            chipControllerRequiredNativeLibraries.each { libName ->
                File lib = new File(new File(new File(root, "jniLibs"), abi), libName)
                if (!lib.isFile()) {
                    throw new GradleException("Missing connectedhomeip controller native library: " + lib)
                }
                if (lib.length() <= 0) {
                    throw new GradleException("Empty connectedhomeip controller native library: " + lib)
                }
            }
        }
    }
}

tasks.register("prepareConnectedHomeIpTrustStoreAssets") {
    inputs.property("openhabMatterChipPaaTrustStoreDir", chipPaaTrustStoreDir)
    inputs.property("openhabMatterChipCdTrustStoreDir", chipCdTrustStoreDir)
    if (!chipPaaTrustStoreDir.isEmpty()) {
        inputs.dir(file(chipPaaTrustStoreDir))
                .withPropertyName("paaTrustStoreDir")
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
    if (!chipCdTrustStoreDir.isEmpty()) {
        inputs.dir(file(chipCdTrustStoreDir))
                .withPropertyName("cdTrustStoreDir")
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
    if (!chipControllerArtifactsDir.isEmpty()) {
        inputs.file(new File(file(chipControllerArtifactsDir), "chip-artifact-manifest.json"))
                .withPropertyName("artifactManifest")
                .optional()
    }
    outputs.dir(generatedTrustStoreAssetsDir)
    doLast {
        File outRoot = generatedTrustStoreAssetsDir.get().asFile
        delete(outRoot)
        File artifactManifest = chipControllerArtifactsDir.isEmpty()
                ? null
                : new File(file(chipControllerArtifactsDir), "chip-artifact-manifest.json")
        boolean hasArtifactManifest = artifactManifest != null && artifactManifest.isFile()
        if (chipPaaTrustStoreDir.isEmpty() && chipCdTrustStoreDir.isEmpty() && !hasArtifactManifest) {
            return
        }
        def manifestData = null
        if (hasArtifactManifest) {
            manifestData = new JsonSlurper().parse(artifactManifest)
            if (chipPaaTrustStoreDir.isEmpty()) {
                throw new GradleException(
                        "connectedhomeip artifact manifest requires a PAA trust store directory")
            }
        }
        def manifestCertFiles = { String manifestPrefix ->
            if (manifestData == null) {
                return null
            }
            def manifestFiles = manifestData.files
            if (!(manifestFiles instanceof Map)) {
                throw new GradleException(
                        "connectedhomeip artifact manifest does not list trust-store checksums")
            }
            return new TreeSet<String>(manifestFiles.keySet()
                    .collect { it.toString() }
                    .findAll { path ->
                        path.startsWith(manifestPrefix) &&
                                (path.endsWith(".pem") || path.endsWith(".der"))
                    }
                    .collect { path -> path.substring(manifestPrefix.length()) })
        }
        def sourceCertFiles = { File sourceRoot ->
            return new TreeSet<String>(fileTree(sourceRoot)
                    .matching { include "**/*.pem", "**/*.der" }
                    .files
                    .collect { File sourceFile ->
                        sourceRoot.toPath()
                                .relativize(sourceFile.toPath())
                                .toString()
                                .replace(File.separator, "/")
                    })
        }
        def assertExactTrustStoreCoverage = {
                File sourceRoot, String manifestPrefix, List<String> sourceFiles ->
            if (manifestData == null) {
                return
            }
            def expectedFiles = manifestCertFiles(manifestPrefix)
            def missingFiles = new TreeSet<String>(expectedFiles)
            missingFiles.removeAll(sourceFiles)
            def unexpectedFiles = new TreeSet<String>(sourceFiles)
            unexpectedFiles.removeAll(expectedFiles)
            if (!missingFiles.isEmpty()) {
                throw new GradleException(
                        "Trust store is missing manifest-covered files for "
                                + manifestPrefix + ": " + missingFiles.join(", "))
            }
            if (!unexpectedFiles.isEmpty()) {
                throw new GradleException(
                        "Trust store contains files not covered by the artifact manifest for "
                                + manifestPrefix + ": " + unexpectedFiles.join(", "))
            }
            def manifestFiles = manifestData.files
            sourceFiles.each { String relative ->
                File sourceFile = new File(sourceRoot, relative)
                String manifestPath = manifestPrefix + relative
                String expectedDigest = manifestFiles[manifestPath]?.toString()
                String actualDigest = sha256File(sourceFile)
                if (actualDigest != expectedDigest) {
                    throw new GradleException(
                            "Trust-store file checksum does not match the connectedhomeip artifact manifest: "
                                    + sourceFile
                                    + " (expected "
                                    + expectedDigest
                                    + ", found "
                                    + actualDigest
                                    + ")")
                }
            }
        }
        outRoot.mkdirs()

        if (hasArtifactManifest) {
            copy {
                from artifactManifest
                into new File(outRoot, "matter/connectedhomeip")
            }
        }

        def packagedPaaFiles = new ArrayList<String>()
        if (!chipPaaTrustStoreDir.isEmpty()) {
            File paaRoot = file(chipPaaTrustStoreDir)
            if (!paaRoot.isDirectory()) {
                throw new GradleException("PAA trust store directory does not exist: " + paaRoot)
            }
            packagedPaaFiles.addAll(sourceCertFiles(paaRoot))
            if (hasArtifactManifest) {
                def expectedPaaFiles = manifestCertFiles("paa-root-certs/")
                if (expectedPaaFiles.isEmpty()) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest lists no PAA trust-store certificates")
                }
                if (packagedPaaFiles.isEmpty()) {
                    throw new GradleException(
                            "connectedhomeip artifact manifest requires packaged PAA trust-store certificates")
                }
                assertExactTrustStoreCoverage(paaRoot, "paa-root-certs/", packagedPaaFiles)
            }
            copy {
                from paaRoot
                include "**/*.pem", "**/*.der"
                into new File(outRoot, "matter/truststore/paa")
            }
        }

        def packagedCdFiles = new ArrayList<String>()
        boolean cdOmitted = false
        if (!chipCdTrustStoreDir.isEmpty()) {
            File cdRoot = file(chipCdTrustStoreDir)
            if (!cdRoot.isDirectory()) {
                throw new GradleException("CD trust store directory does not exist: " + cdRoot)
            }
            packagedCdFiles.addAll(sourceCertFiles(cdRoot))
            if (hasArtifactManifest) {
                assertExactTrustStoreCoverage(cdRoot, "cd-certs/", packagedCdFiles)
            }
            if (!packagedCdFiles.isEmpty()) {
                copy {
                    from cdRoot
                    include "**/*.pem", "**/*.der"
                    into new File(outRoot, "matter/truststore/cd")
                }
            }
        } else if (hasArtifactManifest) {
            def expectedCdFiles = manifestCertFiles("cd-certs/")
            cdOmitted = !expectedCdFiles.isEmpty()
        }

        if (hasArtifactManifest) {
            File provenanceFile = new File(outRoot, "matter/connectedhomeip/apk-truststore-provenance.json")
            provenanceFile.parentFile.mkdirs()
            def provenance = [
                    schema                  : 1,
                    connectedhomeip_tag     : manifestData.connectedhomeip_tag,
                    connectedhomeip_commit  : manifestData.connectedhomeip_commit,
                    artifact_manifest_sha256: sha256File(artifactManifest),
                    paa_files               : packagedPaaFiles,
                    cd_files                : packagedCdFiles,
                    cd_omitted              : cdOmitted
            ]
            provenanceFile.setText(
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(provenance)),
                    "UTF-8")
        }
    }
}

preBuild.dependsOn("verifyOpenhabMatterChipNativeInputs")
preBuild.dependsOn("verifyConnectedHomeIpControllerArtifacts")
preBuild.dependsOn("prepareConnectedHomeIpTrustStoreAssets")
tasks.named("prepareConnectedHomeIpTrustStoreAssets").configure {
    dependsOn("verifyConnectedHomeIpControllerArtifacts")
