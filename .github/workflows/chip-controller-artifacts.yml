name: Build CHIP Controller Artifacts

on:
  # Automatically validate changes to the native artifact build workflow.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chip-controller-artifacts.yml"
  workflow_dispatch:
    inputs:
      connectedhomeip_ref:
        description: "Allowlisted connectedhomeip release tag to build (v1.6.1.0 or v1.5.1.0 for rollback)"
        required: true
        default: "v1.6.1.0"
      publish:
        description: "Publish a new immutable versioned artifact release. Refuses to overwrite an existing tag or asset."
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  build-artifacts:
    name: Build connectedhomeip artifacts
    # Pin the native toolchain host image; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact_tag: ${{ steps.source.outputs.artifact_tag }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      sha256_name: ${{ steps.source.outputs.sha256_name }}
      source_tag: ${{ steps.source.outputs.source_tag }}
      source_commit: ${{ steps.source.outputs.source_commit }}
    env:
      CONNECTEDHOMEIP_REF: ${{ github.event.inputs.connectedhomeip_ref || 'v1.6.1.0' }}
      KOTLIN_VERSION: 2.1.21

    steps:
      - name: Check out openhab-android-matter
        uses: actions/checkout@v6

      - name: Check out connectedhomeip
        uses: actions/checkout@v6
        with:
          repository: project-chip/connectedhomeip
          ref: ${{ env.CONNECTEDHOMEIP_REF }}
          path: connectedhomeip
          fetch-depth: 1

      - name: Validate connectedhomeip ref and resolve immutable source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          case "$CONNECTEDHOMEIP_REF" in
            v1.6.1.0) EXPECTED_SHA="3bcdd56ba54fb88b2afb4bfef575014671df7aa7" ;;
            v1.5.1.0) EXPECTED_SHA="abcc720b48c5e59c0edcfe65c516f76ca9448aa3" ;;
            *)
              echo "::error::Unsupported connectedhomeip ref '$CONNECTEDHOMEIP_REF'. Allowed refs: v1.6.1.0, v1.5.1.0."
              exit 1
              ;;
          esac

          RESOLVED_SHA="$(git -C connectedhomeip rev-parse HEAD)"
          if [[ "$RESOLVED_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::connectedhomeip ref '$CONNECTEDHOMEIP_REF' resolved to $RESOLVED_SHA, expected $EXPECTED_SHA."
            exit 1
          fi

          ARTIFACT_TAG="chip-controller-artifacts-${CONNECTEDHOMEIP_REF}"
          ARTIFACT_NAME="openhab-chip-artifacts-arm64-${CONNECTEDHOMEIP_REF}.zip"
          echo "CHIP_SOURCE_TAG=$CONNECTEDHOMEIP_REF" >> "$GITHUB_ENV"
          echo "CHIP_SOURCE_COMMIT=$RESOLVED_SHA" >> "$GITHUB_ENV"
          echo "CHIP_ARTIFACT_TAG=$ARTIFACT_TAG" >> "$GITHUB_ENV"
          echo "CHIP_ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "CHIP_ARTIFACT_DIR_NAME=openhab-chip-artifacts-arm64-${CONNECTEDHOMEIP_REF}" >> "$GITHUB_ENV"
          echo "CHIP_ARTIFACT_SHA256_NAME=${ARTIFACT_NAME}.sha256" >> "$GITHUB_ENV"
          {
            echo "artifact_tag=$ARTIFACT_TAG"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "sha256_name=${ARTIFACT_NAME}.sha256"
            echo "source_tag=$CONNECTEDHOMEIP_REF"
            echo "source_commit=$RESOLVED_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Validated $CONNECTEDHOMEIP_REF at $RESOLVED_SHA; candidate artifact $ARTIFACT_NAME."

      - name: Initialize connectedhomeip submodules
        shell: bash
        run: |
          set -euo pipefail
          (
            cd connectedhomeip
            python3 scripts/checkout_submodules.py \
              --shallow \
              --platform android \
              --jobs 8
          )

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the action's deprecated default 'tools' SDK package.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Set up Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/kotlin-compiler.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Refresh production PAA trust store from DCL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install \
            -c connectedhomeip/scripts/setup/constraints.txt \
            click-option-group
          python3 connectedhomeip/credentials/fetch_paa_certs_from_dcl.py \
            --use-main-net-http \
            --paa-trust-store-path connectedhomeip/credentials/production/paa-root-certs

      - name: Install native dependencies for Matter Python bootstrap
        shell: bash
        run: |
          set -euo pipefail
          # PyGObject pulls pycairo from source; both need native headers.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            pkg-config \
            libcairo2-dev \
            libgirepository-2.0-dev
          pkg-config --modversion cairo
          pkg-config --modversion girepository-2.0

      - name: Build connectedhomeip Android controller artifacts
        shell: bash
        run: |
          set -eo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          export PATH="$RUNNER_TEMP/kotlinc/bin:$PATH"
          export TERM="${TERM:-xterm-256color}"
          if [[ ! -d "${ANDROID_NDK_HOME}" ]]; then
            echo "::error::Expected NDK directory not found: ${ANDROID_NDK_HOME}"
            exit 1
          fi
          kotlinc -version

          cd connectedhomeip
          set +u
          source scripts/bootstrap.sh
          source scripts/activate.sh
          set -u
          perl -0pi -e 's/(_kotlinc_flags = \[\n)\s+"-Werror",\n(\s+"-Xlint:all",\n\s+\])/$1$2/g' \
            build/chip/java/rules.gni

          python3 scripts/build/build_examples.py \
            --target android-arm64-chip-tool \
            build

      - name: Package artifact layout for openhab-android-matter
        shell: bash
        run: |
          set -euo pipefail
          BUILD_LIB_DIR="$GITHUB_WORKSPACE/connectedhomeip/out/android-arm64-chip-tool/lib"
          PAA_ROOT="$GITHUB_WORKSPACE/connectedhomeip/credentials/production/paa-root-certs"
          CD_ROOT="$GITHUB_WORKSPACE/connectedhomeip/credentials/production/cd-certs"
          OUT_ROOT="$RUNNER_TEMP/$CHIP_ARTIFACT_DIR_NAME"
          OUT_ARCHIVE="$RUNNER_TEMP/$CHIP_ARTIFACT_NAME"
          BUILD_JOB_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          bash scripts/package_chip_controller_artifact.sh \
            --build-lib-dir "$BUILD_LIB_DIR" \
            --paa-root "$PAA_ROOT" \
            --cd-root "$CD_ROOT" \
            --output-dir "$OUT_ROOT" \
            --archive "$OUT_ARCHIVE" \
            --source-tag "$CHIP_SOURCE_TAG" \
            --source-commit "$CHIP_SOURCE_COMMIT" \
            --abi "arm64-v8a" \
            --build-target "android-arm64-chip-tool" \
            --build-profile "release" \
            --jdk "17" \
            --ndk "28.2.13676358" \
            --kotlin "$KOTLIN_VERSION" \
            --build-job-url "$BUILD_JOB_URL"

          echo "CHIP_ARTIFACT_MANIFEST_PATH=$OUT_ROOT/chip-artifact-manifest.json" >> "$GITHUB_ENV"
          echo "CHIP_ARTIFACT_SHA256_PATH=$OUT_ARCHIVE.sha256" >> "$GITHUB_ENV"

      - name: Verify candidate artifact package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum -c "$CHIP_ARTIFACT_SHA256_NAME"

          VERIFY_ROOT="$RUNNER_TEMP/chip-artifact-verify"
          rm -rf "$VERIFY_ROOT"
          mkdir -p "$VERIFY_ROOT"
          unzip -q "$CHIP_ARTIFACT_NAME" -d "$VERIFY_ROOT"

          test -f "$VERIFY_ROOT/chip-artifact-manifest.json"
          jq -e \
            --arg tag "$CHIP_SOURCE_TAG" \
            --arg commit "$CHIP_SOURCE_COMMIT" \
            --arg abi "arm64-v8a" \
            --arg target "android-arm64-chip-tool" \
            '.connectedhomeip_tag == $tag and .connectedhomeip_commit == $commit and .abi == $abi and .build_target == $target' \
            "$VERIFY_ROOT/chip-artifact-manifest.json" >/dev/null

          for entry in \
            CHIPController.jar \
            CHIPInteractionModel.jar \
            CHIPClusterID.jar \
            CHIPClusters.jar \
            AndroidPlatform.jar \
            OnboardingPayload.jar \
            libMatterTlv.jar \
            libMatterJson.jar \
            jniLibs/arm64-v8a/libCHIPController.so \
            jniLibs/arm64-v8a/libc++_shared.so; do
            test -s "$VERIFY_ROOT/$entry"
          done
          test -d "$VERIFY_ROOT/paa-root-certs"
          PAA_CERT="$(find "$VERIFY_ROOT/paa-root-certs" -type f \( -name '*.pem' -o -name '*.der' \) -print -quit)"
          test -n "$PAA_CERT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: chip-controller-artifacts-arm64
          path: |
            ${{ runner.temp }}/openhab-chip-artifacts-arm64-*.zip
            ${{ runner.temp }}/openhab-chip-artifacts-arm64-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-artifact:
    name: Publish immutable versioned release assets
    needs: build-artifacts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CHIP_ARTIFACT_TAG: ${{ needs.build-artifacts.outputs.artifact_tag }}
      CHIP_ARTIFACT_NAME: ${{ needs.build-artifacts.outputs.artifact_name }}
      CHIP_ARTIFACT_SHA256_NAME: ${{ needs.build-artifacts.outputs.sha256_name }}
      CHIP_SOURCE_TAG: ${{ needs.build-artifacts.outputs.source_tag }}
      CHIP_SOURCE_COMMIT: ${{ needs.build-artifacts.outputs.source_commit }}

    steps:
      - name: Download candidate artifact
        uses: actions/download-artifact@v8
        with:
          name: chip-controller-artifacts-arm64
          path: ${{ runner.temp }}/chip-controller-artifacts

      - name: Verify downloaded candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chip-controller-artifacts"
          sha256sum -c "$CHIP_ARTIFACT_SHA256_NAME"
          test -s "$CHIP_ARTIFACT_NAME"

          VERIFY_ROOT="$RUNNER_TEMP/chip-artifact-publish-verify"
          rm -rf "$VERIFY_ROOT"
          mkdir -p "$VERIFY_ROOT"
          unzip -q "$CHIP_ARTIFACT_NAME" -d "$VERIFY_ROOT"
          test -f "$VERIFY_ROOT/chip-artifact-manifest.json"
          jq -e \
            --arg tag "$CHIP_SOURCE_TAG" \
            --arg commit "$CHIP_SOURCE_COMMIT" \
            --arg abi "arm64-v8a" \
            '.connectedhomeip_tag == $tag and .connectedhomeip_commit == $commit and .abi == $abi' \
            "$VERIFY_ROOT/chip-artifact-manifest.json" >/dev/null

      - name: Publish immutable versioned release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chip-controller-artifacts"

          if gh release view "$CHIP_ARTIFACT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release '$CHIP_ARTIFACT_TAG' already exists. Immutable artifacts must not be overwritten."
            echo "::error::Choose a new reviewed artifact version instead of rebuilding this tag."
            exit 1
          fi

          gh release create "$CHIP_ARTIFACT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CHIP Controller Artifacts ${CHIP_SOURCE_TAG}" \
            --notes "Immutable connectedhomeip ${CHIP_SOURCE_TAG} (${CHIP_SOURCE_COMMIT}) Android arm64 controller artifacts for openhab-android-matter. Verify the archive against a separately trusted, maintainer-approved SHA-256 value before use; the co-published ${CHIP_ARTIFACT_SHA256_NAME} sidecar is a convenience copy, not an independent trust anchor. Inspect chip-artifact-manifest.json for source tag, commit, ABI, and per-file checksums."

          gh release upload "$CHIP_ARTIFACT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$CHIP_ARTIFACT_NAME#$CHIP_ARTIFACT_NAME" \
            "$CHIP_ARTIFACT_SHA256_NAME#$CHIP_ARTIFACT_SHA256_NAME"
